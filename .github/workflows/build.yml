name: Build and Test

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.424'

      - name: Restore locked dependency graph
        run: dotnet restore Huaxiazi.sln --locked-mode

      - name: Audit direct and transitive packages
        shell: pwsh
        run: |
          function Invoke-NuGetAudit([string] $project) {
            $jsonText = dotnet list $project package --vulnerable --include-transitive --format json
            if ($LASTEXITCODE -ne 0) { throw "Dependency audit command failed for $project." }
            $json = $jsonText | ConvertFrom-Json
            $vulnerabilities = @(
              foreach ($framework in $json.projects.frameworks) {
                @($framework.topLevelPackages) + @($framework.transitivePackages) |
                  ForEach-Object { $_.vulnerabilities } |
                  Where-Object { $_ }
              }
            )
            if ($vulnerabilities.Count -gt 0) {
              $summary = ($vulnerabilities | ForEach-Object { $_.advisoryurl }) -join ', '
              throw "Vulnerable dependencies found in ${project}: $summary"
            }
          }
          Invoke-NuGetAudit 'Huaxiazi.csproj'
          Invoke-NuGetAudit 'Huaxiazi.Tests/Huaxiazi.Tests.csproj'

      - name: Build (Release)
        run: dotnet build Huaxiazi.sln -c Release --no-restore

      - name: Reject checked-in release binaries
        shell: pwsh
        run: |
          $tracked = git ls-files -- 'release/**'
          if ($tracked) { throw "Release binaries must be produced by CI, not committed to the repository: $tracked" }

      - name: Test core (Release)
        shell: pwsh
        run: |
          $excluded = @(
            'WpfViewSmokeTests','BrandIconTests','CompanionUiContractTests','ThemeSwapRegressionTests',
            'AcceptanceDefectTests','InteractionLayoutReverifyTests','ResponsiveLayoutRegressionTests',
            'ScrollBehaviorTests','IntegerInputBehaviorTests','DecimalInputBehaviorTests',
            'ExceptionPresentationPolicyTests','HotkeyParserTests','SettingsViewModelTests',
            'ThemeServiceTests','WindowPlacementServiceTests'
          )
          $filter = ($excluded | ForEach-Object { "FullyQualifiedName!~$_" }) -join '&'
          dotnet test Huaxiazi.Tests/Huaxiazi.Tests.csproj -c Release --no-build --filter $filter
          if ($LASTEXITCODE -ne 0) { throw "Core tests failed." }

      - name: Test WPF-sensitive groups in isolated hosts
        shell: pwsh
        run: |
          $groups = @(
            'WpfViewSmokeTests','BrandIconTests','CompanionUiContractTests','ThemeSwapRegressionTests',
            'AcceptanceDefectTests','InteractionLayoutReverifyTests','ResponsiveLayoutRegressionTests',
            'ScrollBehaviorTests','IntegerInputBehaviorTests','DecimalInputBehaviorTests',
            'ExceptionPresentationPolicyTests','HotkeyParserTests','SettingsViewModelTests',
            'ThemeServiceTests','WindowPlacementServiceTests'
          )
          foreach ($group in $groups) {
            dotnet test Huaxiazi.Tests/Huaxiazi.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~$group"
            if ($LASTEXITCODE -ne 0) { throw "Isolated test group failed: $group" }
          }

      - name: Publish unsigned self-contained (win-x64)
        shell: pwsh
        run: |
          dotnet publish Huaxiazi.csproj -c Release -r win-x64 --self-contained true -o out/publish/win-x64

      # Update-manifest generation gate. Catches regressions such as the template
      # reverting to a hardcoded version, leftover placeholders, or a manifest
      # version drifting from the csproj <Version>.
      - name: Update manifest generation gate
        shell: pwsh
        run: |
          $csproj = Get-Content Huaxiazi.csproj -Raw
          $version = [regex]::Match($csproj, '<Version>([^<]+)</Version>').Groups[1].Value.Trim()
          if (-not $version) { throw "Could not read <Version> from Huaxiazi.csproj" }
          $rsa = [System.Security.Cryptography.RSA]::Create(2048)
          $gateKey = Join-Path $env:RUNNER_TEMP 'manifest-gate-private.pem'
          try {
            [IO.File]::WriteAllText($gateKey, $rsa.ExportRSAPrivateKeyPem())
            & ./deploy/generate-manifest.ps1 -Version $version -Sha256 ('0' * 64) -DownloadUrl "https://example.invalid/Huaxiazi-Setup.exe" -ReleaseNotes "CI gate check" -SigningKeyPath $gateKey -OutputPath out/version-gate.json
          }
          finally {
            $rsa.Dispose()
            Remove-Item -LiteralPath $gateKey -Force -ErrorAction SilentlyContinue
          }

      - name: Upload unsigned publish artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Huaxiazi-portable-win-x64-unsigned
          path: out/publish/win-x64
          if-no-files-found: error

  package-release:
    name: Package unsigned open-source release
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.424'

      - name: Build checksummed unsigned release
        shell: pwsh
        run: ./publish.ps1 -AllowUnsigned -Clean -SkipTests

      - name: Upload checksummed release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Huaxiazi-${{ github.ref_name }}-unsigned
          path: release/*
          if-no-files-found: error
