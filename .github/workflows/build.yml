name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore
        run: dotnet restore Huaxiazi.sln

      - name: Build (Release)
        run: dotnet build Huaxiazi.sln -c Release --no-restore

      - name: Test (Release)
        run: dotnet test Huaxiazi.Tests/Huaxiazi.Tests.csproj -c Release --no-build

      - name: Publish self-contained (win-x64)
        run: dotnet publish Huaxiazi.csproj -c Release -r win-x64 --self-contained true -o out/publish/win-x64

      # Update-manifest generation gate. Catches regressions such as the template
      # reverting to a hardcoded version, leftover placeholders, or a manifest
      # version drifting from the csproj <Version>.
      - name: Update manifest generation gate
        shell: pwsh
        run: |
          $csproj = Get-Content Huaxiazi.csproj -Raw
          $version = [regex]::Match($csproj, '<Version>([^<]+)</Version>').Groups[1].Value.Trim()
          if (-not $version) { throw "Could not read <Version> from Huaxiazi.csproj" }
          & ./deploy/generate-manifest.ps1 -Version $version -Sha256 ('0' * 64) -DownloadUrl "https://example.invalid/Huaxiazi-Setup.exe" -ReleaseNotes "CI gate check" -OutputPath out/version-gate.json

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: Huaxiazi-portable-win-x64
          path: out/publish/win-x64

      # Optional signing step. Enabled only on push (not PRs) and only when the
      # repository secrets PFX_BASE64 and PFX_PASSWORD are configured. Remove or
      # adjust if you do not use code signing.
      - name: Decode certificate (optional)
        if: ${{ github.event_name == 'push' && secrets.PFX_BASE64 != '' }}
        shell: bash
        run: echo "${{ secrets.PFX_BASE64 }}" | base64 --decode > out/publish/win-x64/sign.pfx

      - name: Sign binaries (optional)
        if: ${{ github.event_name == 'push' && secrets.PFX_BASE64 != '' }}
        run: powershell -ExecutionPolicy Bypass -File deploy/sign.ps1 -DistDir out/publish/win-x64 -CertPath out/publish/win-x64/sign.pfx -CertPassword "${{ secrets.PFX_PASSWORD }}"

      - name: Re-upload signed publish artifact (optional)
        if: ${{ github.event_name == 'push' && secrets.PFX_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Huaxiazi-portable-win-x64-signed
          path: out/publish/win-x64
